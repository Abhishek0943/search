<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Layout</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    header, footer {
      background: #111;
      color: #fff;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    header .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 18px;
      padding: 18px 0;
    }

    aside {
      background: #f5f5f5;
      padding: 16px;
      border: 1px solid #e6e6e6;
    }

    aside h3 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .categories {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .categories a {
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }

    .categories a:hover {
      text-decoration: underline;
    }

    main {
      background: #fff;
      padding: 16px;
      border: 1px solid #e6e6e6;
      min-height: 360px;
    }

    main h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .post {
      border: 1px dashed #bbb;
      padding: 14px;
      margin: 0 0 12px;
    }

    footer {
      padding: 14px 0;
      font-size: 14px;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }

      nav ul {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="container bar">
      <div class="logo">MyBlog</div>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Posts</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container layout">
    <aside>
      <h3>Categories</h3>
      <ul class="categories">
        <li><a href="#">Tech</a></li>
        <li><a href="#">Design</a></li>
        <li><a href="#">Lifestyle</a></li>
        <li><a href="#">Travel</a></li>
      </ul>
    </aside>

    <main>
      <h1>Blog Posts</h1>
      <div class="post">Post placeholder</div>
      <div class="post">Post placeholder</div>
      <div class="post">Post placeholder</div>
    </main>
  </div>

  <footer>
    <div class="container">© 2026 MyBlog</div>
  </footer>

</body>
</html>
