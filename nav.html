<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sticky Navbar</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:#e9eefc;
    }

    .wrap{
      width:min(1100px, 92vw);
      margin:0 auto;
    }


    .navbar{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(15,27,51,.78);
      border-bottom:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(10px);
    }

    .nav-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:12px 0;
    }


    nav ul{
      list-style:none;
      margin:0;
      padding:0;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    nav a{
      display:inline-block;
      padding:8px 12px;
      border-radius:10px;
      text-decoration:none;
      color:#9fb0d3;
      border:1px solid transparent;
    }

    nav a:hover{
      color:#e9eefc;
      background:rgba(255,255,255,.06);
      border-color:rgba(255,255,255,.10);
      transform:translateY(-1px);
    }

    nav a:focus-visible{
      outline:none;
      box-shadow:0 0 0 4px rgba(122,162,255,.35);
      border-color:rgba(122,162,255,.65);
      color:#e9eefc;
    }

    .cta{
      padding:8px 12px;
      border-radius:10px;
      background:rgba(122,162,255,.14);
      color:#e9eefc;
      border:1px solid rgba(122,162,255,.35);
    }
    .main{
        height: 200vh;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="wrap nav-inner">
      <nav aria-label="Primary">
        <ul>
          <li><a href="#section-1">Overview</a></li>
          <li><a href="#section-2">Features</a></li>
          <li><a href="#section-3">Docs</a></li>
          <li><a href="#section-4" class="cta">Get Started</a></li>
        </ul>
      </nav>
    </div>
</div>
<div class="main">

</div>
</body>
</html>
